<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 820" role="img" aria-labelledby="title desc">
  <title id="title">Kinesis Advantage360 Pro Swedish Programmer Dvorak base layer</title>
  <desc id="desc">Base layer diagram for the custom Advantage360 Pro keymap.</desc>
  <style>
    .bg { fill: #f7f8fb; }
    .key { fill: #ffffff; stroke: #c8ced8; stroke-width: 2; }
    .legend { fill: #111827; font: 18px Inter, "Segoe UI", Arial, sans-serif; font-weight: 650; text-anchor: middle; dominant-baseline: middle; }
    .small { fill: #4b5563; font: 11px Inter, "Segoe UI", Arial, sans-serif; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
    .tiny { fill: #4b5563; font: 10px Inter, "Segoe UI", Arial, sans-serif; font-weight: 600; text-anchor: middle; dominant-baseline: middle; }
    .layer { fill: #fff7ed; stroke: #fb923c; }
    .swe { fill: #f5f3ff; stroke: #8b5cf6; }
    .shift { fill: #ecfdf5; stroke: #34d399; }
    .thumb { fill: #eff6ff; stroke: #60a5fa; }
    .desk { fill: #ecfeff; stroke: #22d3ee; }
    .nav { fill: #f9fafb; stroke: #9ca3af; }
    .title { fill: #111827; font: 28px Inter, "Segoe UI", Arial, sans-serif; font-weight: 750; }
    .subtitle { fill: #4b5563; font: 15px Inter, "Segoe UI", Arial, sans-serif; }
    .note { fill: #374151; font: 13px Inter, "Segoe UI", Arial, sans-serif; font-weight: 600; }
  </style>
  <rect class="bg" width="1800" height="820"/>
  <text class="title" x="44" y="46">Base layer: Swedish Programmer Dvorak</text>
  <text class="subtitle" x="44" y="74">Host OS stays on Swedish QWERTY. Large text is unshifted; small text is shifted where relevant.</text>

  <g id="left-keywell" transform="translate(42 126)">
    <rect class="key" x="0" y="0" width="102" height="70" rx="8"/><text class="legend" x="51" y="29">&amp;</text><text class="small" x="51" y="53">%</text>
    <rect class="key" x="110" y="0" width="86" height="70" rx="8"/><text class="legend" x="153" y="29">[</text><text class="small" x="153" y="53">7</text>
    <rect class="key" x="204" y="-20" width="86" height="70" rx="8"/><text class="legend" x="247" y="9">{</text><text class="small" x="247" y="33">5</text>
    <rect class="key" x="298" y="-20" width="86" height="70" rx="8"/><text class="legend" x="341" y="9">}</text><text class="small" x="341" y="33">3</text>
    <rect class="key" x="392" y="-20" width="86" height="70" rx="8"/><text class="legend" x="435" y="9">(</text><text class="small" x="435" y="33">1</text>
    <rect class="key" x="486" y="-20" width="86" height="70" rx="8"/><text class="legend" x="529" y="9">=</text><text class="small" x="529" y="33">9</text>
    <rect class="layer" x="580" y="-20" width="86" height="70" rx="8"/><text class="legend" x="623" y="9">Kp</text><text class="tiny" x="623" y="33">toggle</text>

    <rect class="key" x="0" y="78" width="102" height="70" rx="8"/><text class="legend" x="51" y="113">Tab</text>
    <rect class="key" x="110" y="78" width="86" height="70" rx="8"/><text class="legend" x="153" y="107">;</text><text class="small" x="153" y="131">:</text>
    <rect class="key" x="204" y="58" width="86" height="70" rx="8"/><text class="legend" x="247" y="87">,</text><text class="small" x="247" y="111">&lt;</text>
    <rect class="key" x="298" y="58" width="86" height="70" rx="8"/><text class="legend" x="341" y="87">.</text><text class="small" x="341" y="111">&gt;</text>
    <rect class="key" x="392" y="58" width="86" height="70" rx="8"/><text class="legend" x="435" y="93">P</text>
    <rect class="key" x="486" y="58" width="86" height="70" rx="8"/><text class="legend" x="529" y="93">Y</text>
    <rect class="key" x="580" y="58" width="86" height="70" rx="8"/><text class="legend" x="623" y="93">①</text>

    <rect class="key" x="0" y="156" width="102" height="70" rx="8"/><text class="legend" x="51" y="191">Home</text>
    <rect class="key" x="110" y="156" width="86" height="70" rx="8"/><text class="legend" x="153" y="191">A</text>
    <rect class="key" x="204" y="136" width="86" height="70" rx="8"/><text class="legend" x="247" y="171">O</text>
    <rect class="key" x="298" y="136" width="86" height="70" rx="8"/><text class="legend" x="341" y="171">E</text>
    <rect class="key" x="392" y="136" width="86" height="70" rx="8"/><text class="legend" x="435" y="171">U</text>
    <rect class="key" x="486" y="136" width="86" height="70" rx="8"/><text class="legend" x="529" y="171">I</text>
    <rect class="key" x="580" y="136" width="86" height="70" rx="8"/><text class="legend" x="623" y="171">②</text>

    <rect class="key" x="0" y="234" width="102" height="70" rx="8"/><text class="legend" x="51" y="269">End</text>
    <rect class="key" x="110" y="234" width="86" height="70" rx="8"/><text class="legend" x="153" y="263">'</text><text class="small" x="153" y="287">"</text>
    <rect class="key" x="204" y="214" width="86" height="70" rx="8"/><text class="legend" x="247" y="249">Q</text>
    <rect class="key" x="298" y="214" width="86" height="70" rx="8"/><text class="legend" x="341" y="249">J</text>
    <rect class="key" x="392" y="214" width="86" height="70" rx="8"/><text class="legend" x="435" y="249">K</text>
    <rect class="key" x="486" y="214" width="86" height="70" rx="8"/><text class="legend" x="529" y="249">X</text>

    <rect class="layer" x="0" y="312" width="102" height="70" rx="8"/><text class="legend" x="51" y="341">Fn</text><text class="tiny" x="51" y="365">hold</text>
    <rect class="key" x="110" y="312" width="86" height="70" rx="8"/><text class="legend" x="153" y="341">@</text><text class="small" x="153" y="365">^</text>
    <rect class="key" x="204" y="292" width="86" height="70" rx="8"/><text class="legend" x="247" y="321">-</text><text class="small" x="247" y="345">_</text>
    <rect class="nav" x="298" y="292" width="86" height="70" rx="8"/><text class="legend" x="341" y="327">←</text>
    <rect class="nav" x="392" y="292" width="86" height="70" rx="8"/><text class="legend" x="435" y="327">→</text>
  </g>

  <g id="right-keywell" transform="translate(1032 126)">
    <rect class="layer" x="0" y="-20" width="86" height="70" rx="8"/><text class="legend" x="43" y="9">Mod</text><text class="tiny" x="43" y="33">hold</text>
    <rect class="key" x="94" y="-20" width="86" height="70" rx="8"/><text class="legend" x="137" y="9">*</text><text class="small" x="137" y="33">0</text>
    <rect class="key" x="188" y="-20" width="86" height="70" rx="8"/><text class="legend" x="231" y="9">)</text><text class="small" x="231" y="33">2</text>
    <rect class="key" x="282" y="-20" width="86" height="70" rx="8"/><text class="legend" x="325" y="9">+</text><text class="small" x="325" y="33">4</text>
    <rect class="key" x="376" y="-20" width="86" height="70" rx="8"/><text class="legend" x="419" y="9">]</text><text class="small" x="419" y="33">6</text>
    <rect class="key" x="470" y="0" width="86" height="70" rx="8"/><text class="legend" x="513" y="29">!</text><text class="small" x="513" y="53">8</text>
    <rect class="key" x="564" y="0" width="102" height="70" rx="8"/><text class="legend" x="615" y="29">#</text><text class="small" x="615" y="53">`</text>

    <rect class="key" x="0" y="58" width="86" height="70" rx="8"/><text class="legend" x="43" y="93">③</text>
    <rect class="key" x="94" y="58" width="86" height="70" rx="8"/><text class="legend" x="137" y="93">F</text>
    <rect class="key" x="188" y="58" width="86" height="70" rx="8"/><text class="legend" x="231" y="93">G</text>
    <rect class="key" x="282" y="58" width="86" height="70" rx="8"/><text class="legend" x="325" y="93">C</text>
    <rect class="key" x="376" y="58" width="86" height="70" rx="8"/><text class="legend" x="419" y="93">R</text>
    <rect class="key" x="470" y="78" width="86" height="70" rx="8"/><text class="legend" x="513" y="113">L</text>
    <rect class="key" x="564" y="78" width="102" height="70" rx="8"/><text class="legend" x="615" y="107">\</text><text class="small" x="615" y="131">|</text>

    <rect class="swe" x="0" y="136" width="86" height="70" rx="8"/><text class="legend" x="43" y="163">④</text><text class="tiny" x="43" y="187">Swe toggle</text>
    <rect class="key" x="94" y="136" width="86" height="70" rx="8"/><text class="legend" x="137" y="171">D</text>
    <rect class="key" x="188" y="136" width="86" height="70" rx="8"/><text class="legend" x="231" y="171">H</text>
    <rect class="key" x="282" y="136" width="86" height="70" rx="8"/><text class="legend" x="325" y="171">T</text>
    <rect class="key" x="376" y="136" width="86" height="70" rx="8"/><text class="legend" x="419" y="171">N</text>
    <rect class="key" x="470" y="156" width="86" height="70" rx="8"/><text class="legend" x="513" y="191">S</text>
    <rect class="nav" x="564" y="156" width="102" height="70" rx="8"/><text class="legend" x="615" y="191">PgUp</text>

    <rect class="key" x="94" y="214" width="86" height="70" rx="8"/><text class="legend" x="137" y="249">B</text>
    <rect class="key" x="188" y="214" width="86" height="70" rx="8"/><text class="legend" x="231" y="249">M</text>
    <rect class="key" x="282" y="214" width="86" height="70" rx="8"/><text class="legend" x="325" y="249">W</text>
    <rect class="key" x="376" y="214" width="86" height="70" rx="8"/><text class="legend" x="419" y="249">V</text>
    <rect class="key" x="470" y="234" width="86" height="70" rx="8"/><text class="legend" x="513" y="269">Z</text>
    <rect class="nav" x="564" y="234" width="102" height="70" rx="8"/><text class="legend" x="615" y="269">PgDn</text>

    <rect class="nav" x="188" y="292" width="86" height="70" rx="8"/><text class="legend" x="231" y="327">↑</text>
    <rect class="nav" x="282" y="292" width="86" height="70" rx="8"/><text class="legend" x="325" y="327">↓</text>
    <rect class="key" x="376" y="292" width="86" height="70" rx="8"/><text class="legend" x="419" y="321">/</text><text class="small" x="419" y="345">?</text>
    <rect class="key" x="470" y="312" width="86" height="70" rx="8"/><text class="legend" x="513" y="341">$</text><text class="small" x="513" y="365">~</text>
    <rect class="layer" x="564" y="312" width="102" height="70" rx="8"/><text class="legend" x="615" y="341">Fn</text><text class="tiny" x="615" y="365">hold</text>
  </g>

  <g id="thumbs-left" transform="translate(626 518)">
    <rect class="thumb" x="0" y="0" width="84" height="68" rx="8"/><text class="legend" x="42" y="34">Ctrl</text>
    <rect class="thumb" x="92" y="0" width="84" height="68" rx="8"/><text class="legend" x="134" y="34">Win</text>
    <rect class="desk" x="46" y="76" width="84" height="68" rx="8"/><text class="legend" x="88" y="105">Desk</text><text class="small" x="88" y="129">←</text>
    <rect class="thumb" x="-58" y="152" width="84" height="124" rx="8"/><text class="legend" x="-16" y="201">Back</text><text class="small" x="-16" y="225">space</text>
    <rect class="thumb" x="34" y="152" width="84" height="124" rx="8"/><text class="legend" x="76" y="214">Esc</text>
    <rect class="shift" x="126" y="152" width="84" height="124" rx="8"/><text class="legend" x="168" y="201">Left</text><text class="small" x="168" y="225">Shift</text>
  </g>

  <g id="thumbs-right" transform="translate(914 518)">
    <rect class="thumb" x="0" y="0" width="84" height="68" rx="8"/><text class="legend" x="42" y="34">Alt</text>
    <rect class="thumb" x="92" y="0" width="84" height="68" rx="8"/><text class="legend" x="134" y="29">Right</text><text class="small" x="134" y="53">Ctrl</text>
    <rect class="desk" x="46" y="76" width="84" height="68" rx="8"/><text class="legend" x="88" y="105">Desk</text><text class="small" x="88" y="129">→</text>
    <rect class="shift" x="-58" y="152" width="84" height="124" rx="8"/><text class="legend" x="-16" y="201">Right</text><text class="small" x="-16" y="225">Shift</text>
    <rect class="thumb" x="34" y="152" width="84" height="124" rx="8"/><text class="legend" x="76" y="214">Enter</text>
    <rect class="thumb" x="126" y="152" width="84" height="124" rx="8"/><text class="legend" x="168" y="214">Space</text>
  </g>

  <g transform="translate(42 768)">
    <rect class="layer" x="0" y="-18" width="18" height="18" rx="4"/><text class="note" x="28" y="-5">layer key</text>
    <rect class="swe" x="126" y="-18" width="18" height="18" rx="4"/><text class="note" x="154" y="-5">Swedish toggle</text>
    <rect class="shift" x="306" y="-18" width="18" height="18" rx="4"/><text class="note" x="334" y="-5">real Shift</text>
    <rect class="desk" x="450" y="-18" width="18" height="18" rx="4"/><text class="note" x="478" y="-5">Windows virtual desktop</text>
  </g>
</svg>
